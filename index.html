<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Player</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">Audio Player</h1>
        <span class="badge" id="totalAudioBadge">0 Audio</span>
      </div>
      <div class="header-right">
        <button id="fullscreenBtn" class="btn btn-secondary" title="Mode Layar Penuh">
          <svg id="fullscreenEnterIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          <svg id="fullscreenExitIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
          <span id="fullscreenBtnText">Layar Penuh</span>
        </button>
        <label for="folderInput" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Buka Folder Lain
        </label>
        <input type="file" id="folderInput" webkitdirectory directory multiple hidden accept="audio/*">
      </div>
    </header>

    <!-- Main Content Area -->
    <div class="main-layout">
      <!-- Playlist Panel -->
      <section class="playlist-section">
        <div class="playlist-toolbar">
          <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="Cari nama audio atau folder...">
          </div>
          <button id="resetPlaylistBtn" class="btn btn-sm" title="Kembalikan ke audio default">Reset</button>
        </div>

        <div id="folderGroupsContainer" class="folder-groups">
          <!-- Folder items rendered dynamically -->
        </div>
      </section>

      <!-- Player Panel -->
      <section class="player-section">
        <div class="now-playing-card">
          <div class="track-meta">
            <div class="track-folder" id="currentTrackFolder">Pilih audio untuk memutar</div>
            <h2 class="track-title" id="currentTrackTitle">-</h2>
            <div class="track-file" id="currentTrackFile"></div>
          </div>

          <!-- Waveform / Progress -->
          <div class="progress-container">
            <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0" step="0.1">
            <div class="time-display">
              <span id="currentTime">00:00</span>
              <span id="totalDuration">00:00</span>
            </div>
          </div>

          <!-- Controls -->
          <div class="controls-row">
            <button id="shuffleBtn" class="btn-icon" title="Acak urutan">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
            </button>
            <button id="prevBtn" class="btn-icon btn-nav" title="Audio Sebelumnya">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
            </button>
            <button id="playPauseBtn" class="btn-icon btn-play" title="Putar / Jeda">
              <svg id="playIcon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
              <svg id="pauseIcon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <button id="nextBtn" class="btn-icon btn-nav" title="Audio Selanjutnya">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
            </button>
            <button id="loopBtn" class="btn-icon active" title="Ulangi (Loop): Aktif">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            </button>
          </div>

          <!-- Secondary Toolbar: Volume & Speed -->
          <div class="player-footer">
            <div class="volume-container">
              <button id="muteBtn" class="btn-icon-subtle" title="Mute / Unmute">
                <svg id="volumeHighIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                <svg id="volumeMuteIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
              </button>
              <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.8" class="volume-bar">
              <span id="volumeValue">80%</span>
            </div>

            <div class="speed-container">
              <label for="speedSelect">Kecepatan:</label>
              <select id="speedSelect" class="speed-select">
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1" selected>1.0x (Normal)</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2.0x</option>
              </select>
            </div>
          </div>
        </div>

        <div class="shortcuts-hint">
          <span>Pintasan: <strong>Spasi</strong> (Play/Pause) &bull; <strong>&larr;/&rarr;</strong> (Mundur/Maju 5s) &bull; <strong>&uarr;/&darr;</strong> (Volume)</span>
        </div>
      </section>
    </div>
  </div>

  <audio id="audioElement" preload="metadata" loop></audio>
  <script src="js/script.js"></script>
</body>
</html>
